<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartboard · shopping cart history</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛍️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1b3d;--mute:#76688a;--bg:#fff6fb;--card:#fff;--line:#f0dff0;--grape:#7c4dff;--mint:#1fbf8f;--tang:#ff7a3d;--berry:#ff4f8b;
--Fashion:#ff6b9a;--Beauty:#ff9f5a;--Home:#35c9a0;--Tech:#5b8def;--Books:#9b6bff;--Fitness:#f5c518;--Food:#ff7a59;--Toys:#3cc8e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,sans-serif;
background-image:radial-gradient(circle at 8% -5%,#ffd6ec 0,transparent 32%),radial-gradient(circle at 95% 0,#d9ccff 0,transparent 30%)}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px clamp(14px,3vw,36px);background:#fff6fbe6;backdrop-filter:blur(10px)}
.logo{font-size:26px;font-weight:800;color:var(--berry);margin-right:6px}.logo span{color:var(--grape)}
.search{flex:1;min-width:200px;max-width:520px;padding:12px 18px;border:2px solid var(--line);border-radius:999px;background:#fff}
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:700;background:var(--ink);color:#fff}.btn.pink{background:var(--berry)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.danger{background:#fff;color:#c2255c;border:2px solid #ffc9dc}
main{padding:6px clamp(14px,3vw,36px) 60px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.sticker{padding:10px 16px;border-radius:18px;font-weight:700;background:var(--c);transform:rotate(var(--r))}.sticker b{font:800 22px "Bricolage Grotesque";margin-right:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 15px;font-weight:500}.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
select{border:2px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff}
.who{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 18px;margin-bottom:18px}
.who .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:800 20px "Bricolage Grotesque";background:var(--grape);color:#fff}
.board{columns:5 230px;column-gap:16px}
.pin{break-inside:avoid;margin:0 0 16px;background:var(--card);border-radius:24px;overflow:hidden;cursor:pointer;border:0;width:100%;text-align:left;padding:0;box-shadow:0 4px 18px #7c4dff14;transition:transform .2s,box-shadow .2s}
.pin:hover{transform:translateY(-4px);box-shadow:0 12px 28px #7c4dff2b}
.collage{display:grid;gap:3px;grid-template-columns:1fr 1fr;padding:3px 3px 0}
.tile{display:grid;place-items:center;background:var(--c);font-size:44px;aspect-ratio:1;border-radius:21px 21px 6px 6px}
.collage.n1 .tile{grid-column:span 2;aspect-ratio:1/1.1;font-size:96px}.collage.n3 .tile:first-child{grid-column:span 2;aspect-ratio:2/1;font-size:64px}
.tile{border-radius:6px}.collage .tile:first-child{border-top-left-radius:21px}.collage .tile:nth-child(2){border-top-right-radius:21px}.collage.n1 .tile:first-child{border-top-right-radius:21px}.collage.n3 .tile:first-child{border-top-right-radius:21px}
.more{position:absolute}
.meta{padding:12px 16px 16px}.meta h3{font-size:17px}.meta p{margin:2px 0 8px;color:var(--mute);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.price{font:800 19px "Bricolage Grotesque"}
.st{padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700}.st.purchased{background:#ece4ff;color:#5a2fd6}.st.abandoned{background:#ffe6d6;color:#c2410c}.st.active{background:#d4f7ea;color:#0b7a58}
.empty{padding:70px 10px;text-align:center;color:var(--mute)}.empty .big{font-size:56px}
dialog{border:0;border-radius:28px;padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 30px 80px #2a1b3d55;color:var(--ink)}dialog::backdrop{background:#2a1b3d66}
.sheet{padding:22px 24px 26px}.sheet .collage{padding:0;margin:-22px -24px 16px;width:calc(100% + 48px);grid-template-columns:repeat(auto-fit,minmax(60px,1fr))}
.band{display:flex;overflow:hidden;margin:-22px -24px 16px;height:92px}.band div{flex:1;display:grid;place-items:center;font-size:40px;background:var(--c)}
.line{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}.line .e{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--c)}.line .g{flex:1}
.tl{list-style:none;margin:10px 0 0;padding:0 0 0 18px;border-left:3px solid var(--line)}.tl li{position:relative;padding:3px 0 8px 12px}.tl li:before{content:"";position:absolute;left:-26px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--berry)}.tl small{color:var(--mute)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:10px 0;max-height:260px;overflow:auto}
.prod{border:2px solid transparent;border-radius:16px;padding:8px 4px;background:color-mix(in srgb,var(--c) 22%,#fff);text-align:center;font-size:12px;position:relative}.prod .em{font-size:30px;display:block}.prod.on{border-color:var(--ink)}
.prod i{position:absolute;top:-6px;right:-6px;background:var(--ink);color:#fff;border-radius:999px;min-width:22px;font-style:normal;font-weight:700}
.field{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:14px;margin:6px 0}.hits{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:20}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header>
  <h1 class="logo">cart<span>board</span></h1>
  <input id="q" class="search" type="search" placeholder="Search customer, city, customer ID or cart number" aria-label="Search carts">
  <button class="btn pink" id="newBtn">New cart</button>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div id="who"></div>
  <div class="filters">
    <span id="statusChips"></span>
    <select id="state" aria-label="State"><option value="">All states</option></select>
    <select id="category" aria-label="Category"><option value="">All categories</option></select>
    <select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest total</option><option value="low">Lowest total</option></select>
  </div>
  <div class="board" id="board"></div>
  <div class="empty" id="empty" hidden><div class="big">🧺</div><h2>No carts match these filters</h2><p>Clear a filter or search for another customer.</p></div>
  <p style="text-align:center"><button class="btn ghost" id="moreBtn" hidden>Show more carts</button></p>
</main>
<dialog id="detail"></dialog><dialog id="create"></dialog>
<script src="app.js"></script></body></html>
